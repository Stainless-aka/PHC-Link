<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102b3f">
<meta name="description" content="PHC Link connects primary healthcare stock management and patient referrals.">
<title>PHC Link — Primary Healthcare Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:"DM Sans",sans-serif;color:#172b3a;background:#f4f7f9;font-synthesis:none;text-rendering:optimizeLegibility;color-scheme:light;--bg:#f4f7f9;--surface:#fff;--ink:#172b3a;--muted:#71808c;--line:#e2e8ed;--navy:#102b3f;--navy2:#183d55;--teal:#087f83;--teal-soft:#e6f3f2;--green:#24764e;--green-bg:#e8f4ec;--amber:#94620b;--amber-bg:#fbf3df;--red:#a43d3d;--red-bg:#faeaea;--shadow:0 2px 8px #142f4210,0 14px 36px #142f4208}
*{box-sizing:border-box}html{min-width:320px;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.55 "DM Sans",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #65b8bd;outline-offset:2px}.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.sm{width:16px;height:16px}.ic.lg{width:23px;height:23px}
.top{height:76px;background:var(--navy);color:#fff;padding:0 clamp(18px,4vw,56px);display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #ffffff18}.brand{display:flex;align-items:center;gap:13px;min-width:0}.logo{width:39px;height:39px;border-radius:10px;background:#0b8184;color:#fff;display:grid;place-items:center}.brand h1{font:800 18px/1.2 Manrope,sans-serif;margin:0;letter-spacing:-.04em}.brand p{margin:3px 0 0;color:#b9c9d3;font-size:11px;letter-spacing:.02em}.seg{display:flex;gap:5px;background:#ffffff12;border:1px solid #ffffff20;border-radius:9px;padding:4px}.seg button{border:0;background:transparent;color:#c3d0d8;border-radius:6px;padding:8px 13px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
main#root{max-width:1500px;margin:0 auto;padding:30px clamp(16px,4vw,56px) 60px}.stage{display:block;width:100%}.device{width:100%;max-width:none;padding:0;background:transparent;box-shadow:none}.screen-wrap{height:auto;max-height:none;min-height:0;overflow:visible;background:transparent;border-radius:0;display:flex;flex-direction:column;gap:0}.sb{display:none}.hdr{background:var(--surface);color:var(--ink);padding:20px 24px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;align-items:center}.hdr b{font:700 19px Manrope,sans-serif;letter-spacing:-.03em}.hdr small{color:var(--muted);opacity:1;font-size:12px;margin-top:3px}.lang{background:#f0f4f6;border-radius:7px;padding:3px}.lang button{color:var(--muted);border:0;background:transparent;border-radius:5px;padding:6px 10px;font-weight:700;font-size:11px}.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.net{order:2;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:11px 24px;background:#f9fbfc;border:1px solid var(--line);border-top:0;font-size:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;background:var(--green-bg);color:var(--green);border:1px solid #d7eade;font-size:11px;font-weight:700}.chip.off{background:var(--red-bg);color:var(--red);border-color:#f0dada}.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.tabs{order:1;display:flex;gap:5px;align-items:center;padding:0 20px;background:var(--surface);border:1px solid var(--line);border-top:0;border-bottom:1px solid var(--line)}.tabs button{min-height:51px;padding:0 17px;display:flex;align-items:center;gap:9px;border:0;border-bottom:2px solid transparent;background:transparent;color:#71808c;font-size:12px;font-weight:600}.tabs button[aria-current=page]{color:var(--teal);border-bottom-color:var(--teal);background:transparent}
.body{order:3;overflow:visible;flex:initial;padding:28px 24px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;min-height:420px}
h2,.dh h2{font:700 21px/1.3 Manrope,sans-serif;letter-spacing:-.035em;margin:0 0 5px;color:var(--ink)}h3{font:700 13px Manrope,sans-serif;margin:24px 0 10px;color:#344b5b}.sub{font-size:12px;color:var(--muted);margin:0 0 20px}.hint{font-size:11px;color:var(--muted);margin:5px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,190px));gap:12px;margin:22px 0 26px}.stat{background:#f7f9fa;border:1px solid var(--line);border-radius:8px;padding:14px 16px}.stat b{font:700 25px/1.1 Manrope,sans-serif;display:block;color:var(--ink)}.stat span{font-size:11px;color:var(--muted)}.stat.low b{color:var(--amber)}.stat.out b{color:var(--red)}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #edf1f3;max-width:100%}.item:last-child{border:0}.ico{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:9px;background:var(--teal-soft);color:var(--teal)}.ico.low{background:var(--amber-bg);color:var(--amber)}.ico.out{background:var(--red-bg);color:var(--red)}.grow{flex:1;min-width:0}.grow b{display:block;font-size:12px;font-weight:700}.grow small{font-size:11px;color:var(--muted)}.bar{height:5px;background:#eaf0f3;border-radius:10px;overflow:hidden;margin-top:7px;max-width:440px}.bar i{display:block;height:100%;border-radius:10px}
.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:5px;font-size:10px;font-weight:700;white-space:nowrap}.ok{background:var(--green-bg);color:var(--green)}.low{background:var(--amber-bg);color:var(--amber)}.out{background:var(--red-bg);color:var(--red)}.q{background:#eef2f4;color:#62727e}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;padding:10px 15px;border:1px solid var(--teal);border-radius:7px;background:var(--teal);color:#fff;font-size:12px;font-weight:700;transition:background .15s,border-color .15s}.btn:hover{background:#066d71;border-color:#066d71}.btn.sec{background:#fff;color:#425867;border-color:var(--line)}.btn.sec:hover{background:#f5f8f9}.btn.sm{width:auto;min-height:32px;padding:6px 10px;font-size:11px;border-radius:6px}.stack{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px;max-width:440px}.stack .btn{width:auto;min-width:155px}
.step{display:flex;align-items:center;gap:5px;background:#f4f7f8;border:1px solid var(--line);border-radius:7px;padding:3px}.step button{width:29px;height:29px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#344b5b;font-weight:700}.step output{min-width:28px;text-align:center;font-size:12px;font-weight:700}
label{display:block;font-size:11px;font-weight:700;color:#405563;margin:15px 0 6px}input,select{width:100%;min-height:42px;padding:10px 12px;border:1px solid #dce4e9;border-radius:7px;background:#fff;color:var(--ink);font-size:12px}input:focus,select:focus{border-color:var(--teal);outline:2px solid #087f831c}.banner{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;margin-bottom:18px;background:var(--amber-bg);color:var(--amber);border:1px solid #f0e5c8;border-radius:7px;font-size:11px;font-weight:600}.lcd{min-height:140px;margin:15px 0;padding:17px;border-radius:8px;background:#102b3f;color:#a7e6c0;font:12px/1.6 ui-monospace,monospace}.lcd pre{white-space:pre-wrap;font:inherit;margin:9px 0 0}.msg{padding:10px 12px;margin:7px 0;background:#f5f8f9;border:1px solid var(--line);border-radius:7px;font-size:11px}.row2{display:flex;gap:8px;max-width:520px}.row2 input{flex:1;min-width:0}.toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 16px;background:var(--navy);color:#fff;border-radius:7px;box-shadow:var(--shadow);font-size:12px;max-width:calc(100vw - 32px)}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:22px}.dh h2{font-size:23px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi{display:flex;align-items:center;gap:13px;padding:17px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 8px #142f4206}.kpi .ico{width:42px;height:42px}.kpi span{display:block;color:var(--muted);font-size:10px;font-weight:600}.kpi b{display:block;font:700 25px/1.2 Manrope,sans-serif;margin-top:3px}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}.col{display:grid;gap:16px;align-content:start}.card{padding:19px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 8px #142f4206;min-width:0}.card h2{font-size:15px;margin-bottom:4px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;padding:10px 9px;color:#788792;font-size:10px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 9px;border-bottom:1px solid #edf1f3;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover,tr.sel{background:#f5f9fa}tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}.blocks{display:flex;gap:3px}.blocks i{width:13px;height:6px;border-radius:2px;background:var(--green)}.blocks i.low{background:var(--amber)}.blocks i.out{background:var(--red)}svg.map{width:100%;height:auto;display:block;background:#f4f7f8;border-radius:7px}svg.map circle{cursor:pointer}.legend{display:flex;gap:13px;margin-top:10px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.meter{display:flex;justify-content:space-between;gap:10px;font-size:11px}.meter+.bar{margin:5px 0 13px}.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f3;font-size:11px}.rrow:last-child{border:0}.rrow small{display:block;color:var(--muted);font-size:10px}
@media(min-width:1000px){.stage{max-width:none}.body{padding:30px 32px}.hdr{padding:22px 32px}.tabs{padding:0 26px}.net{padding:10px 32px}.stats{margin-top:24px}.stack{margin-top:24px}}
@media(max-width:900px){main#root{padding:20px 14px 40px}.top{height:auto;min-height:70px;padding:13px 16px;flex-wrap:wrap}.brand p{font-size:10px}.seg{margin-left:auto}.seg button{padding:7px 9px;font-size:10px}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.body{padding:22px 18px}.tabs{overflow-x:auto}.tabs button{min-width:95px;justify-content:center;padding:0 10px}.screen-wrap{min-height:0}.hdr{border-radius:9px 9px 0 0}}
@media(max-width:560px){.top{align-items:flex-start;gap:12px}.brand{width:100%}.seg{width:100%;margin:0}.seg button{flex:1;justify-content:center}.brand h1{font-size:16px}.hdr{padding:16px}.body{padding:18px 14px}.net{padding:10px 14px;flex-wrap:wrap}.tabs{padding:0 7px}.tabs button{min-width:77px;gap:5px;font-size:10px}.tabs .ic{width:16px;height:16px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:11px 9px}.stat b{font-size:21px}.stat span{font-size:9px}.kpis{gap:8px}.kpi{padding:12px;gap:9px}.kpi .ico{width:34px;height:34px}.kpi b{font-size:21px}.kpi span{font-size:9px}.card{padding:14px}.dh h2{font-size:20px}.item{gap:9px}.item .ico{width:33px;height:33px}.grow b{font-size:11px}.grow small{font-size:10px}.step button{width:26px;height:27px}.step output{min-width:23px}.stack .btn{flex:1;min-width:0}.row2{gap:6px}.row2 .btn{padding-inline:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2"/></symbol>
<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4L12 14l-3-3"/></symbol>
<symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M2 21h20M8 8h3M8 12h3M8 16h3"/></symbol>
<symbol id="i-pill" viewBox="0 0 24 24"><path d="M10.5 20.5a5 5 0 0 1-7-7l10-10a5 5 0 0 1 7 7zM8.5 8.5l7 7"/></symbol>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.7C8 7.5 5 10.7 5 14.5a7 7 0 0 0 14 0c0-3.8-3-7-7-11.8z"/></symbol>
<symbol id="i-test" viewBox="0 0 24 24"><path d="M9 2v6L4.5 18A2.5 2.5 0 0 0 6.8 21h10.4a2.5 2.5 0 0 0 2.3-3L15 8V2M8 2h8M7 14h10"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="i-cross" viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
</defs></svg>
<header class="top">
  <div class="brand"><div class="logo"><svg class="ic lg"><use href="#i-cross"/></svg></div><div><h1>PHC Link</h1><p>PRIMARY HEALTHCARE OPERATIONS PLATFORM</p></div></div>
  <div class="seg" role="group" aria-label="Switch workspace">
    <button id="vApp" aria-pressed="true" onclick="setView('app')"><svg class="ic sm"><use href="#i-phone"/></svg>Facility workspace</button>
    <button id="vDash" aria-pressed="false" onclick="setView('dash')"><svg class="ic sm"><use href="#i-building"/></svg>Administration</button>
  </div>
</header>
<main id="root"></main>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
