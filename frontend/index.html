<style>
:root{font-family:"DM Sans",sans-serif;color:#192d3b;background:#f5f7f9;font-synthesis:none;text-rendering:optimizeLegibility;color-scheme:light;--canvas:#f5f7f9;--white:#fff;--ink:#192d3b;--muted:#788894;--line:#e5eaee;--navy:#142f43;--navy2:#1c4056;--teal:#087f83;--teal-soft:#e8f4f3;--green:#26764e;--green-bg:#eaf4ed;--amber:#98670e;--amber-bg:#fbf3e2;--red:#a94343;--red-bg:#faeceb;--shadow:0 1px 3px #17364a0a,0 8px 24px #17364a08}
*{box-sizing:border-box}html{min-width:320px;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font:14px/1.55 "DM Sans",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #70c3c5;outline-offset:2px}.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.sm{width:16px;height:16px}.ic.lg{width:22px;height:22px}
.top{height:70px;padding:0 clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:2}.brand{display:flex;align-items:center;gap:12px}.logo{width:37px;height:37px;display:grid;place-items:center;background:var(--navy);color:#fff;border-radius:9px}.brand h1{font:800 17px/1.2 Manrope,sans-serif;letter-spacing:-.04em;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:10px;letter-spacing:.08em;font-weight:600}.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#f7f9fa}.seg button{display:flex;align-items:center;gap:8px;padding:8px 12px;border:0;border-radius:5px;background:transparent;color:#657783;font-size:11px;font-weight:700}.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
main#root{max-width:1600px;margin:0 auto;padding:24px clamp(14px,3vw,42px) 48px}.stage{width:100%}.device{width:100%;max-width:none;padding:0;background:transparent;box-shadow:none}.screen-wrap{display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto auto minmax(560px,1fr);grid-template-areas:"header header" "net net" "nav content";min-height:690px;background:#fff;border:1px solid #e1e7eb;border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}.sb{display:none}
.hdr{grid-area:header;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 25px;background:#fff;border-bottom:1px solid var(--line)}.hdr b{display:block;font:700 17px/1.3 Manrope,sans-serif;letter-spacing:-.025em}.hdr small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.lang{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:7px;background:#f8fafb}.lang button{padding:5px 9px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:10px;font-weight:700}.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.net{grid-area:net;display:flex;align-items:center;gap:10px;min-height:42px;padding:7px 25px;background:#fbfcfd;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:5px;background:var(--green-bg);color:var(--green);border:1px solid #dcece1;font-size:10px;font-weight:700}.chip.off{background:var(--red-bg);color:var(--red);border-color:#f0dddd}.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}.net .btn{margin-left:auto}
.tabs{grid-area:nav;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:20px 13px;background:var(--navy);border-right:1px solid #102a3b}.tabs:before{content:"FACILITY WORKSPACE";display:block;padding:0 11px 13px;color:#93aab8;font-size:9px;letter-spacing:.12em;font-weight:700}.tabs button{display:flex;align-items:center;gap:12px;min-height:43px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#bdcbd4;text-align:left;font-size:12px;font-weight:600}.tabs button[aria-current=page]{background:#ffffff16;color:#fff;box-shadow:inset 3px 0 0 #50c0b8}.tabs button[aria-current=page] .ic{color:#70d0c8}.tabs button:hover:not([aria-current=page]){background:#ffffff0c;color:#fff}
.body{grid-area:content;min-width:0;padding:30px clamp(20px,3vw,42px);background:var(--canvas);overflow:visible;min-height:560px}
h2,.dh h2{font:700 22px/1.3 Manrope,sans-serif;letter-spacing:-.04em;color:var(--ink);margin:0 0 5px}h3{font:700 14px Manrope,sans-serif;color:var(--ink);margin:23px 0 10px}.sub{margin:0 0 18px;color:var(--muted);font-size:12px}.hint{margin:5px 0 13px;color:var(--muted);font-size:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(120px,180px));gap:10px;margin:22px 0 25px}.stat{padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:7px}.stat b{display:block;font:700 24px/1.1 Manrope,sans-serif;color:var(--ink)}.stat span{font-size:10px;color:var(--muted)}.stat.low b{color:var(--amber)}.stat.out b{color:var(--red)}
.item{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #e9eef1}.item:last-child{border:0}.ico{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:8px;background:var(--teal-soft);color:var(--teal)}.ico.low{background:var(--amber-bg);color:var(--amber)}.ico.out{background:var(--red-bg);color:var(--red)}.grow{flex:1;min-width:0}.grow b{display:block;font-size:12px;font-weight:700}.grow small{color:var(--muted);font-size:10px}.bar{height:5px;margin-top:7px;max-width:420px;overflow:hidden;border-radius:8px;background:#e9eef1}.bar i{display:block;height:100%;border-radius:8px}
.pill{display:inline-flex;align-items:center;padding:4px 7px;border-radius:4px;font-size:9px;font-weight:700;white-space:nowrap}.ok{background:var(--green-bg);color:var(--green)}.low{background:var(--amber-bg);color:var(--amber)}.out{background:var(--red-bg);color:var(--red)}.q{background:#edf1f4;color:#61727e}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;width:100%;padding:9px 14px;border:1px solid var(--teal);border-radius:6px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;transition:background .15s,border-color .15s}.btn:hover{background:#066d71;border-color:#066d71}.btn.sec{background:#fff;color:#3e5665;border-color:#dce4e9}.btn.sec:hover{background:#f5f8f9}.btn.sm{width:auto;min-height:30px;padding:5px 10px;font-size:10px}.stack{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px;max-width:440px}.stack .btn{width:auto;min-width:145px}
.step{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);border-radius:6px;background:#f7f9fa}.step button{width:28px;height:27px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#334b5b;font-weight:700}.step output{min-width:27px;text-align:center;font-size:11px;font-weight:700}
label{display:block;margin:14px 0 6px;color:#405563;font-size:11px;font-weight:700}input,select{width:100%;min-height:40px;padding:9px 11px;border:1px solid #dce4e9;border-radius:6px;background:#fff;color:var(--ink);font-size:11px}input:focus,select:focus{border-color:var(--teal);outline:2px solid #087f831c}.banner{display:flex;align-items:flex-start;gap:9px;margin-bottom:16px;padding:10px 12px;border:1px solid #f0e5c8;border-radius:6px;background:var(--amber-bg);color:var(--amber);font-size:11px;font-weight:600}.lcd{min-height:135px;margin:14px 0;padding:16px;border-radius:7px;background:#102b3f;color:#a7e6c0;font:12px/1.6 ui-monospace,monospace}.lcd pre{margin:8px 0 0;white-space:pre-wrap;font:inherit}.msg{margin:7px 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:11px}.row2{display:flex;gap:8px;max-width:520px}.row2 input{flex:1;min-width:0}.toast{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100vw - 30px);padding:10px 15px;border-radius:6px;background:var(--navy);color:#fff;box-shadow:var(--shadow);font-size:11px}
.note{margin:12px 0 0;text-align:right;color:#87949d;font-size:10px}
/* Administration workspace */
.dashboard{width:100%}.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:22px}.eyebrow{color:#82919b;font-size:9px;font-weight:700;letter-spacing:.13em;margin-bottom:6px}.dash-head h2{font-size:24px}.dash-head .sub{margin:5px 0 0}.report-date{display:flex;align-items:center;gap:7px;color:#72828d;font-size:10px;padding-bottom:5px}.live-dot{width:7px;height:7px;border-radius:50%;background:#d39a35}.date-sep{color:#c4cdd3}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:17px}.kpi{display:flex;align-items:center;gap:12px;min-width:0;padding:15px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 3px #17364a08}.kpi .ico{width:38px;height:38px}.kpi .ico.out{background:var(--red-bg);color:var(--red)}.kpi .ico.low{background:var(--amber-bg);color:var(--amber)}.kpi-copy{min-width:0}.kpi-copy span{display:block;color:#758590;font-size:10px;font-weight:600}.kpi-copy b{display:block;margin:2px 0;font:700 23px/1.15 Manrope,sans-serif;letter-spacing:-.03em}.kpi-copy small{display:block;color:#9aa6ad;font-size:9px}
.dash-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(285px,.85fr);gap:15px;align-items:start}.dash-main,.dash-side{display:grid;gap:15px;min-width:0}.panel{min-width:0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 3px #17364a08}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.panel-head h3{margin:0;font-size:14px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:10px}.panel-head .eyebrow{margin-bottom:4px}.count-label{padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:#74838e;font-size:9px;font-weight:700;white-space:nowrap}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:10px}th{padding:10px 9px;border-bottom:1px solid var(--line);color:#84919a;text-align:left;font-size:9px;font-weight:700;white-space:nowrap}td{padding:12px 9px;border-bottom:1px solid #edf1f3;color:#596d79;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover{background:#f7fafb}tbody tr.sel{background:#eff7f6}tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}td strong{color:#273d4b;font-size:10px}.facility-mark{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:8px;vertical-align:middle;border-radius:5px;background:#edf3f6;color:#526d7e}.status-wrap{display:flex;align-items:center;gap:7px}.status-detail{color:#87949c;font-size:9px}.table-arrow{color:#9aa7ae;font-size:17px}.table-foot{display:flex;justify-content:space-between;gap:10px;padding-top:11px;color:#94a0a8;font-size:9px}.table-foot strong{color:#617580}.referral-list{display:grid}.referral-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #edf1f3}.referral-row:last-child{border:0}.ref-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:#edf4f6;color:#597687}.ref-details{flex:1;min-width:0}.ref-details strong{display:block;color:#304654;font-size:10px 9px}
@media(max-width:1050px){.screen-wrap{grid-template-columns:190px minmax(0,1fr)}.dash-layout{grid-template-columns:minmax(0,1.3fr) minmax(260px,.9fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.status-detail{display:none}}
@media(max-width:760px){main#root{padding:14px 10px 35px}.top{height:auto;min-height:65px;padding:11px 14px}.brand p{font-size:8px}.seg button{padding:7px 8px;font-size:9px}.screen-wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(420px,1fr) auto;grid-template-areas:"header" "net" "content" "nav";min-height:0;border-radius:8px}.hdr{padding:15px 16px}.net{padding:7px 15px}.tabs{flex-direction:row;justify-content:space-around;padding:6px 5px;background:#fff;border-top:1px solid var(--line);border-right:0}.tabs:before{display:none}.tabs button{flex:1;min-height:48px;flex-direction:column;justify-content:center;gap:3px;padding:4px 2px;color:#778791;font-size:9px}.tabs button[aria-current=page]{background:#edf6f5;color:var(--teal);box-shadow:none}.tabs button[aria-current=page] .ic{color:var(--teal)}.body{padding:21px 16px;min-height:420px}.dash-layout{grid-template-columns:1fr}.dash-side{grid-template-columns:1fr 1fr}.dash-head{align-items:flex-start;flex-direction:column}.report-date{padding:0}.table-foot{flex-direction:column}.note{text-align:left}}
@media(max-width:520px){.top{flex-wrap:wrap;gap:9px}.brand{width:100%}.seg{width:100%}.seg button{flex:1;justify-content:center}.brand h1{font-size:16px}.body{padding:18px 12px}.hdr{padding:13px}.net{flex-wrap:wrap;gap:7px}.net .btn{margin-left:0}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:10px 8px}.stat b{font-size:20px}.stat span{font-size:9px}.kpis{gap:7px}.kpi{padding:10px;gap:8px}.kpi .ico{width:31px;height:31px}.kpi-copy span{font-size:9px}.kpi-copy b{font-size:20px}.kpi-copy small{font-size:8px}.panel{padding:13px}.dash-side{grid-template-columns:1fr}.dash-head h2{font-size:21px}.panel-head{gap:7px}.ref-age{display:none}.stack .btn{flex:1;min-width:0}.row2{gap:6px}.row2 .btn{padding-inline:9px}.table-foot{font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<header class="top">
